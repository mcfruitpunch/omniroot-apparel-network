<style>
:root{--ink:#182b2a;--muted:#566b67;--line:#dce5df;--paper:#fcfbf7;--warm:#f6f1e8;--green:#21594c;--green2:#36725e;--orange:#bb7049;--pink:#f3e1d8;--card:#fff;--shadow:0 12px 35px rgba(25,51,43,.07);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);font-size:15px}
*{box-sizing:border-box}body{background:var(--paper);margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8bb8a1;outline-offset:2px}
.shell{width:min(1300px,calc(100% - 40px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffcf7ec;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:13px 0}.brand{font-weight:800;letter-spacing:-.035em;font-size:22px;white-space:nowrap}.brand span{color:var(--orange)}.tiny{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:750;color:var(--orange)}.top nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.nav-btn{padding:11px 12px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:13px;font-weight:680}.nav-btn.active,.nav-btn:hover{background:#e9eee9;color:var(--green)}.demo-badge{padding:7px 11px;background:var(--pink);border:1px solid #ebcfc0;border-radius:20px;color:#7c4b34;font-size:11px;font-weight:800;white-space:nowrap}main{min-height:75vh;padding-bottom:70px}.hero{background:linear-gradient(110deg,#194c40 0%,#235e4b 58%,#497666 100%);color:#fff;padding:70px min(7vw,85px);margin-top:28px;border-radius:23px;min-height:390px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-100px;bottom:-150px;width:470px;height:470px;border:1px solid #ffffff38;border-radius:50%;box-shadow:0 0 0 42px #ffffff06,0 0 0 90px #ffffff06,0 0 0 134px #ffffff08}.hero .eyebrow{color:#eac2a6}.hero h1{font-size:clamp(38px,5.5vw,77px);line-height:1.05;letter-spacing:-.06em;max-width:720px;margin:17px 0 22px;font-weight:760}.hero p{max-width:560px;font-size:17px;line-height:1.6;color:#e4efe8}.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:12px;padding:12px 19px;font-weight:730;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}.btn:hover{background:#163f35}.btn.secondary{background:#fff;color:var(--green);border-color:#cbdcd3}.btn.secondary:hover{background:#f2f9f4}.btn.light{background:#f5e4d5;border-color:#f5e4d5;color:#24483d}.btn.light:hover{background:#fff}.btn.small{padding:9px 13px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.section{margin-top:45px}.section-top{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:21px;flex-wrap:wrap}.section h2,.page-title{font-size:clamp(26px,3.5vw,42px);line-height:1.17;letter-spacing:-.045em;margin:8px 0}.section p,.lead{color:var(--muted);line-height:1.6}.pagehead{padding-top:32px;margin-bottom:24px}.pagehead .lead{max-width:770px;margin-top:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.panel,.tile,.product,.metric{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.tile{padding:22px}.tile h3{margin:14px 0 7px;letter-spacing:-.025em;font-size:19px}.tile p{font-size:14px;line-height:1.52;color:var(--muted);margin:0}.tile .tile-icon{width:45px;height:45px;background:#e8efe7;border-radius:13px;display:grid;place-items:center;font-size:24px}.metric{padding:20px}.metric strong{display:block;font-size:27px;letter-spacing:-.04em}.metric span{font-size:12px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:12px;line-height:1.6}.footer .shell{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.85fr);gap:22px}.shop-layout{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(300px,1.1fr) minmax(260px,.9fr);gap:17px;align-items:start}.shop-layout .panel{padding:20px}.productlist{display:grid;gap:10px}.product{padding:10px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;box-shadow:none}.product:hover,.product.selected{border-color:#36725e;background:#f0f7f2}.product-visual{width:74px;height:84px;background:#f3f1e9;border-radius:11px;display:grid;place-items:center;flex-shrink:0}.product strong{display:block;font-size:14px}.product span{color:var(--muted);display:block;font-size:12px;margin-top:3px}.visual-large{height:248px;background:linear-gradient(145deg,#f5eee1,#ecf1e9);border-radius:13px;display:grid;place-items:center;margin-bottom:16px}.visual-large svg{height:235px;width:210px}.swatch{width:21px;height:21px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b7c1b7}.tag{display:inline-block;background:#e7eee8;color:#25604e;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:730}.tag.amber{background:#fbebd9;color:#98622a}.tag.gray{background:#f0f1ef;color:#6c7370}.formgroup{margin:0 0 17px}.formgroup label{display:block;font-size:13px;font-weight:720;margin-bottom:7px}.formgroup small{display:block;color:var(--muted);line-height:1.45;margin-top:6px}.field{width:100%;background:white;color:var(--ink);border:1px solid #c9d6cd;border-radius:10px;padding:11px 11px;min-height:44px}.field:focus{border-color:#32745c}.config-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.price-line{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:13px;margin:12px 0}.price-line strong{color:var(--ink);font-variant-numeric:tabular-nums}.price-total{border-top:1px solid var(--line);margin:15px 0 0;padding-top:17px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:730}.price-total strong{font-size:29px;letter-spacing:-.04em}.help{font-size:12px;color:var(--muted);line-height:1.5}.note{background:#f1f6f2;border-left:3px solid #4f927b;padding:13px 14px;border-radius:5px 9px 9px 5px;color:#3f6154;font-size:13px;line-height:1.55}.notice-warm{background:#fff2e4;border-left-color:#cb8357;color:#765336}.notice-error{background:#fff0ec;border-left-color:#c14c47;color:#8e3730}.panel-heading{font-size:18px;font-weight:750;letter-spacing:-.025em;margin:0 0 15px}.pillset{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:30px;color:var(--ink);font-size:13px}.choice.active{border-color:#386d56;background:#eaf5ee;color:var(--green);font-weight:730}.fit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.input-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between}.form-check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.4}.form-check input{margin-top:3px;accent-color:var(--green)}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.order-card{padding:20px}.order-card + .order-card{margin-top:12px}.flex-between{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.progress{display:flex;flex-wrap:wrap;gap:4px;margin:15px 0}.progress span{background:#ecefe9;color:#657770;font-size:11px;padding:7px 9px;border-radius:8px}.progress span.done{background:#d8e9dc;color:#215947}.progress span.current{background:#235b48;color:#fff}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{padding:12px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.data-table th{color:var(--muted);font-weight:650}.inline-links{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.empty{border:1px dashed #aac0ae;background:#f9fcf8;padding:27px;border-radius:12px;text-align:center;color:var(--muted);line-height:1.5}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.micro{font-size:12px}.step-stack{display:grid;gap:11px}.step{display:flex;align-items:flex-start;gap:13px}.step-number{height:31px;min-width:31px;border-radius:50%;display:grid;place-items:center;background:#e8f1e9;color:var(--green);font-weight:800}.step p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.status-line{padding:8px 12px;border-radius:8px;display:inline-flex;background:#e5f1e8;color:#205d43;font-size:12px;font-weight:730}.status-line.pending{background:#fff0d7;color:#956029}.toast{position:fixed;right:23px;bottom:20px;background:#173f33;color:#fff;border-radius:12px;padding:13px 18px;box-shadow:0 8px 30px #172d2633;max-width:340px;z-index:99;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:none}.hide{display:none!important}.overline{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);font-weight:760}hr{border:0;border-top:1px solid var(--line);margin:18px 0}h4{margin:12px 0 8px}textarea{resize:vertical;min-height:105px}.kpi-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fa181;margin-right:5px}.back-btn{background:transparent;border:none;color:var(--green);font-weight:750;padding:6px 0}
@media(max-width:1060px){.topline{align-items:start;flex-direction:column;gap:9px}.shop-layout{grid-template-columns:minmax(215px,.85fr) minmax(300px,1.1fr)}.shop-layout .quote{grid-column:1/-1}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.shell{width:min(100% - 24px,1300px)}.top nav{overflow:auto;flex-wrap:nowrap;width:calc(100vw - 24px);padding-bottom:5px}.nav-btn{white-space:nowrap}.demo-badge{display:none}.hero{padding:46px 25px;min-height:355px}.hero h1{font-size:41px}.grid3,.grid4,.split,.shop-layout,.two-col,.metric-row{grid-template-columns:1fr}.shop-layout .quote{grid-column:auto}.productlist{grid-template-columns:1fr 1fr}.product{align-items:flex-start;flex-direction:column}.product-visual{width:100%;height:95px}.fit-grid{grid-template-columns:1fr 1fr}.topline{padding:11px 0}}
@media(max-width:430px){.productlist,.fit-grid,.config-row{grid-template-columns:1fr}.hero h1{font-size:35px}.hero p{font-size:15px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="shell topline"><div class="brand">OMNIROOT <span>/</span> APPAREL <div class="tiny" style="font-weight:600;letter-spacing:.09em;margin-top:2px">A better way to get dressed</div></div><nav aria-label="Primary navigation" id="nav"></nav><span class="demo-badge">INTERACTIVE CONCEPT · V0.1</span></div></header>
<main id="app" class="shell"></main>
<footer class="footer"><div class="shell"><span><b>OmniRoot Apparel Network</b> · Functional product concept · No accounts, payment processing, upload service, or factory connections.</span><span>Prototype data stays in browser memory and resets when the page reloads.</span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const fabrics=[
 {id:"cotton",name:"Organic cotton twill",delta:0,fiber:"Cotton",feel:"Structured · breathable",colors:[{name:"Clay",hex:"#bd795e"},{name:"Forest",hex:"#3d6758"},{name:"Stone",hex:"#b8ae9f"}],works:["top","bottom","layer"]},
 {id:"linen",name:"Linen blend",delta:12,fiber:"Linen/cotton",feel:"Airy · lived-in",colors:[{name:"Natural",hex:"#c4b8a1"},{name:"Ocean",hex:"#718e96"},{name:"Terracotta",hex:"#b96c57"}],works:["top","bottom","layer"]},
 {id:"denim",name:"Recycled denim",delta:18,fiber:"Cotton blend",feel:"Durable · substantial",colors:[{name:"Indigo",hex:"#4b617d"},{name:"Black",hex:"#444947"}],works:["bottom","layer"]},
 {id:"jersey",name:"Soft jersey",delta:8,fiber:"Lyocell/cotton",feel:"Soft · flexible",colors:[{name:"Sage",hex:"#809985"},{name:"Cocoa",hex:"#816957"},{name:"Cream",hex:"#cfcab8"}],works:["top"]},
 {id:"canvas",name:"Heavy canvas",delta:23,fiber:"Cotton",feel:"Protective · heavyweight",colors:[{name:"Olive",hex:"#70755a"},{name:"Rust",hex:"#aa7251"}],works:["layer","bottom"]}
];
const originalDesigns=[
 {id:"over",title:"Everyday overshirt",type:"top",desc:"Layer-friendly shirt with easy tailoring options.",base:78,license:0,by:"OmniRoot sample pattern",approved:true},
 {id:"trouser",title:"Relaxed trousers",type:"bottom",desc:"Comfortable everyday pants with personalized rise and inseam.",base:89,license:0,by:"OmniRoot sample pattern",approved:true},
 {id:"jacket",title:"Utility jacket",type:"layer",desc:"A functional outer layer with configurable pockets.",base:116,license:0,by:"OmniRoot sample pattern",approved:true},
 {id:"tunic",title:"Soft tunic",type:"top",desc:"Unstructured layer that can work with softer fabrics.",base:67,license:0,by:"OmniRoot sample pattern",approved:true}
];
const statuses=["submitted","accepted","cutting","sewing","quality_check","ready_for_pickup","collected"];
const statusLabels={submitted:"Awaiting maker review",accepted:"Accepted by maker",cutting:"Cutting",sewing:"Sewing / assembly",quality_check:"Quality control",ready_for_pickup:"Ready for pickup",collected:"Collected"};
const state={view:"home",designs:structuredClone(originalDesigns),selected:"over",fabric:"cotton",color:"#bd795e",cut:"relaxed",length:"standard",pockets:"standard",pickup:"retail",fit:{label:"",unit:"cm",chest:"",waist:"",hip:"",inseam:"",shoulder:"",preferences:"",adaptive:""},fitReady:false,orders:[],designerSubmissions:[],nextId:1001};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs=s=>document.querySelector(s);
const design=()=>state.designs.find(d=>d.id===state.selected)||state.designs[0];
const fabric=()=>fabrics.find(f=>f.id===state.fabric)||fabrics[0];
function eligibleFabrics(){return fabrics.filter(f=>f.works.includes(design().type))}
function setBestFabric(){if(!eligibleFabrics().some(f=>f.id===state.fabric)){state.fabric=eligibleFabrics()[0].id}if(!fabric().colors.some(c=>c.hex===state.color))state.color=fabric().colors[0].hex}
function prices(){const d=design(),f=fabric();return {base:d.base,materials:f.delta,designer:d.license,options:(state.length==="extended"?14:0)+(state.pockets==="extra"?10:0),coordination:9,total:d.base+f.delta+d.license+(state.length==="extended"?14:0)+(state.pockets==="extra"?10:0)+9}}
function garmentsvg(d,color,size="small"){
 const stroke="#24392f",c=color||"#bc795e";
 let shape="";
 if(d.type==="bottom")shape=`<path d="M60 28 L140 28 L150 71 L132 190 L101 190 L97 101 L91 101 L86 190 L54 190 L46 71 Z" fill="${c}" stroke="${stroke}" stroke-width="3"/><path d="M60 49 L137 49 M99 51 L97 98 M71 62 L82 70 M120 62 L111 70" stroke="${stroke}" stroke-opacity=".45" fill="none" stroke-width="2"/>`;
 else if(d.type==="layer")shape=`<path d="M70 22 L88 30 L112 30 L131 22 L161 45 L178 126 L146 132 L138 85 L138 190 L61 190 L61 85 L52 132 L21 126 L39 45 Z" fill="${c}" stroke="${stroke}" stroke-width="3"/><path d="M88 30 L98 51 L112 30 M98 51 L98 190 M70 79 L90 79 L90 105 L70 105 Z M111 79 L130 79 L130 105 L111 105 Z" fill="none" stroke="${stroke}" stroke-opacity=".6" stroke-width="2"/>`;
 else shape=`<path d="M70 28 L87 34 L112 34 L130 28 L155 52 L174 123 L146 130 L132 82 L134 186 L65 186 L67 82 L53 130 L26 123 L44 52 Z" fill="${c}" stroke="${stroke}" stroke-width="3"/><path d="M87 34 L100 53 L112 34 M100 53 L100 186 M80 83 L92 83 L92 103 L80 103 Z M108 83 L120 83 L120 103 L108 103 Z" stroke="${stroke}" stroke-opacity=".55" stroke-width="2" fill="none"/>`;
 return `<svg viewBox="0 0 200 210" width="${size==='small'?65:210}" height="${size==='small'?73:240}" role="img" aria-label="Stylized illustration of ${escapeHTML(d.title)}"><ellipse cx="100" cy="198" rx="59" ry="5" fill="#bdc3b6" opacity=".5"/>${shape}</svg>`;
}
function nav(){const pages=[["home","Overview"],["shop","Shop + customize"],["fit","Fit Passport"],["designer","Designer Studio"],["maker","Maker Hub"],["orders","Orders"]];qs("#nav").innerHTML=pages.map(([id,label])=>`<button class="nav-btn ${state.view===id?'active':''}" data-nav="${id}" ${state.view===id?'aria-current="page"':''}>${label}</button>`).join("")}
function pagehead(eyebrow,title,lead){return `<div class="pagehead"><div class="overline">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="lead">${lead}</p></div>`}
function home(){return `<div class="hero"><div class="overline eyebrow">Personalized fashion, locally connected</div><h1>Your body.<br>Your fabric.<br>Your design.</h1><p>Discover a future where clothing adapts to you—and designers, makers, and retailers work together to bring it to life.</p><div class="hero-actions"><button class="btn light" data-nav="shop">Explore clothing →</button><button class="btn secondary" data-nav="fit">Build Fit Passport</button></div></div><section class="section"><div class="section-top"><div><div class="overline">The network</div><h2>One system, four experiences</h2><p>A connected path from personal measurements to finished garments.</p></div></div><div class="grid4"><div class="tile"><div class="tile-icon">🧵</div><h3>Customers</h3><p>Choose a design, fabric, and details; track your order.</p><div class="inline-links"><button class="btn secondary small" data-nav="shop">Open storefront</button></div></div><div class="tile"><div class="tile-icon">📏</div><h3>Fit Passport</h3><p>Own your sizing details and choose what to share.</p><div class="inline-links"><button class="btn secondary small" data-nav="fit">View passport</button></div></div><div class="tile"><div class="tile-icon">🎨</div><h3>Designers</h3><p>Publish concepts into a controlled production pipeline.</p><div class="inline-links"><button class="btn secondary small" data-nav="designer">Open studio</button></div></div><div class="tile"><div class="tile-icon">🪡</div><h3>Makers</h3><p>Review orders, validate patterns, and track production.</p><div class="inline-links"><button class="btn secondary small" data-nav="maker">Open queue</button></div></div></div></section><section class="section"><div class="split"><div class="panel" style="padding:27px"><div class="overline">How the pilot works</div><h2 style="margin-top:12px">One complete order journey</h2><div class="step-stack"><div class="step"><span class="step-number">1</span><div><b>Choose or submit a pattern</b><p>The customer browses approved designs. A designer can propose new designs for technical review.</p></div></div><div class="step"><span class="step-number">2</span><div><b>Select fit and materials</b><p>The customer supplies measurements, chooses fabric and customization options, and agrees to share only relevant measurements.</p></div></div><div class="step"><span class="step-number">3</span><div><b>Maker confirms feasibility</b><p>A maker reviews the simulated production package and advances work through cutting, assembly, and quality checks.</p></div></div><div class="step"><span class="step-number">4</span><div><b>Pickup and future repair</b><p>The order reaches a simulated pickup point. Repair and resale are planned for later releases.</p></div></div></div></div><div class="panel" style="padding:27px;background:#e8eee7"><div class="overline">Boundaries that build trust</div><h2 style="margin-top:11px">A prototype, not a promise of perfect fit.</h2><p class="lead">This clickable demo uses fictional price examples and stores data only in page memory. No body scan, payment, automated patternmaking, factory routing, delivery, or real upload occurs.</p><hr><div class="note">The real platform must have human fit validation, proper production files, consent-based access to measurements, transparent licensing, and accessible interfaces before taking orders.</div><div class="inline-links"><button class="btn" data-nav="shop">Try a demo order</button></div></div></div></section>`}
function shop(){setBestFabric();const d=design(),f=fabric(),p=prices();return `${pagehead("Customer storefront","Customize something that actually feels like you.","Browse a small, production-focused sample catalog. This is a visual configuration and example estimate—not a physical fit simulation or binding quote.")}<div class="shop-layout"><section class="panel"><h2 class="panel-heading">01 / Choose a design</h2><div class="productlist">${state.designs.filter(d=>d.approved).map(x=>`<button class="product ${x.id===d.id?'selected':''}" data-design="${escapeHTML(x.id)}" aria-pressed="${x.id===d.id}"><span class="product-visual">${garmentsvg(x,"#a18b75")}</span><span><strong>${escapeHTML(x.title)}</strong><span>${escapeHTML(x.by)}</span><span>From ${money(x.base)}</span></span></button>`).join("")}</div><p class="help">Designer submissions appear here after maker validation in the demo.</p></section><section class="panel"><h2 class="panel-heading">02 / Make it yours</h2><div class="visual-large">${garmentsvg(d,state.color,"large")}</div><div class="flex-between"><div><strong style="font-size:20px">${escapeHTML(d.title)}</strong><div class="help">${escapeHTML(d.desc)}</div></div><span class="tag">Concept preview</span></div><hr/><div class="formgroup"><label for="fabric">Fabric</label><select id="fabric" class="field" data-config="fabric">${eligibleFabrics().map(x=>`<option value="${x.id}" ${x.id===state.fabric?'selected':''}>${escapeHTML(x.name)}${x.delta?` (+${money(x.delta)})`:''}</option>`).join("")}</select><small>${escapeHTML(f.feel)} · ${escapeHTML(f.fiber)}. Only sample-compatible fabrics are listed.</small></div><div class="formgroup"><label>Colorway</label><div class="pillset">${f.colors.map(c=>`<button class="choice ${state.color===c.hex?'active':''}" data-color="${c.hex}" aria-pressed="${state.color===c.hex}"><span class="swatch" style="display:inline-block;vertical-align:middle;background:${c.hex};margin-right:5px"></span>${escapeHTML(c.name)}</button>`).join("")}</div></div><div class="config-row"><div class="formgroup"><label for="cut">Fit preference</label><select class="field" id="cut" data-config="cut"><option value="relaxed" ${state.cut==='relaxed'?'selected':''}>Relaxed</option><option value="regular" ${state.cut==='regular'?'selected':''}>Regular</option><option value="tailored" ${state.cut==='tailored'?'selected':''}>Tailored</option></select></div><div class="formgroup"><label for="length">Garment length</label><select class="field" id="length" data-config="length"><option value="standard" ${state.length==='standard'?'selected':''}>Standard</option><option value="extended" ${state.length==='extended'?'selected':''}>Extended (+$14)</option></select></div></div><div class="formgroup"><label for="pockets">Pocket configuration</label><select id="pockets" class="field" data-config="pockets"><option value="standard" ${state.pockets==='standard'?'selected':''}>Standard pattern</option><option value="extra" ${state.pockets==='extra'?'selected':''}>Extra utility pockets (+$10)</option></select></div><p class="help">Illustration shows a garment silhouette and approximate fabric color only—not drape, final pattern, or true body proportions.</p></section><section class="panel quote"><h2 class="panel-heading">03 / Review & order</h2><div class="overline">Illustrative USD pricing</div><div class="price-line"><span>Base production + standard material</span><strong>${money(p.base)}</strong></div><div class="price-line"><span>Chosen fabric adjustment</span><strong>${money(p.materials)}</strong></div><div class="price-line"><span>Designer license</span><strong>${money(p.designer)}</strong></div><div class="price-line"><span>Customization options</span><strong>${money(p.options)}</strong></div><div class="price-line"><span>Platform coordination</span><strong>${money(p.coordination)}</strong></div><div class="price-total"><span>Estimated total</span><strong>${money(p.total)}</strong></div><hr><div class="formgroup"><label for="pickup">Fulfillment</label><select id="pickup" class="field" data-config="pickup"><option value="retail" ${state.pickup==='retail'?'selected':''}>Partner retail pickup (concept)</option><option value="maker" ${state.pickup==='maker'?'selected':''}>Pickup from local maker (concept)</option></select></div><div class="note ${state.fitReady?'':'notice-warm'}">${state.fitReady?'Your Fit Passport is prepared. Only measurements needed for this garment will be included in the simulated maker packet.':'You need a Fit Passport before submitting a demo order.'}</div><div class="inline-links"><button class="btn secondary small" data-nav="fit">${state.fitReady?'Edit Fit Passport':'Create Fit Passport'} →</button></div><div style="margin-top:20px"><button class="btn" data-action="place" style="width:100%">Submit demo order</button></div><p class="help">No real checkout or payment. A maker will need to validate fit, pattern and feasibility before a real-world quote.</p></section></div>`}
function fit(){const f=state.fit;const unit=f.unit;const fields=[["chest","Chest circumference"],["waist","Waist circumference"],["hip","Hip circumference"],["inseam","Inseam"],["shoulder","Shoulder width (optional)"]];return `${pagehead("Personal sizing","Your Fit Passport belongs to you.","A measurement record you can edit and selectively share. The prototype stores this information in the current browser tab only; it is not uploaded to a server.")}<div class="split"><section class="panel" style="padding:25px"><div class="flex-between"><h2 class="panel-heading">Manual measurements</h2><div class="pillset"><button class="choice ${unit==='cm'?'active':''}" data-unit="cm" aria-pressed="${unit==='cm'}">cm</button><button class="choice ${unit==='in'?'active':''}" data-unit="in" aria-pressed="${unit==='in'}">inches</button></div></div><div class="formgroup"><label for="fit-label">Passport name (optional)</label><input id="fit-label" class="field" data-fit="label" value="${escapeHTML(f.label)}" placeholder="e.g., My everyday fit" /></div><div class="fit-grid">${fields.map(([k,label])=>`<div class="formgroup"><label for="fit-${k}">${label}</label><input type="number" min="1" max="350" step="0.1" inputmode="decimal" id="fit-${k}" class="field" data-fit="${k}" value="${escapeHTML(f[k])}" placeholder="${unit}" /><small>${unit}. For actual production, follow a measurement guide and verify with a maker.</small></div>`).join("")}</div><hr><div class="formgroup"><label for="fit-preferences">How do you prefer clothing to feel?</label><textarea id="fit-preferences" class="field" data-fit="preferences" placeholder="e.g., loose around shoulders, no tight cuffs, high-rise pants">${escapeHTML(f.preferences)}</textarea></div><div class="formgroup"><label for="fit-adaptive">Adaptive or sensory needs (optional)</label><textarea id="fit-adaptive" class="field" data-fit="adaptive" placeholder="e.g., soft seams, seated fit, alternate fasteners">${escapeHTML(f.adaptive)}</textarea><small>This information should require separate, explicit sharing consent in the production system. It is not included in this demo's maker packet.</small></div><div class="inline-links"><button class="btn" data-action="save-fit">Validate passport</button><button class="btn secondary" data-action="sample-fit">Load fictional sample</button><button class="btn secondary" data-action="export-fit">Export JSON</button><button class="btn secondary" data-action="clear-fit">Clear</button></div><p class="help">Required demo fields: chest, waist, hip, and inseam. Passing validation does not verify actual physical measurements.</p></section><aside class="panel" style="padding:25px"><h2 class="panel-heading">Consent + protection</h2><div class="note">Fit records are sensitive personal information. In the real product, customers must control access and be able to export or erase their records.</div><div class="step-stack" style="margin-top:20px"><div class="step"><span class="step-number">1</span><div><b>Store with precision</b><p>Record units, measurement methods, timestamps, and definitions; don't infer someone’s body from a generic size label.</p></div></div><div class="step"><span class="step-number">2</span><div><b>Share only what's needed</b><p>For an overshirt, a maker may need chest and upper-body measurements, not an entire profile.</p></div></div><div class="step"><span class="step-number">3</span><div><b>Let people revoke access</b><p>Use short-lived access grants and prohibit making a secondary marketing database from body measurements.</p></div></div></div><hr><p class="help"><b>Passport status:</b> <span class="status-line ${state.fitReady?'':'pending'}">${state.fitReady?'Validated for demo':'Incomplete or not validated'}</span></p></aside></div>`}
function designer(){const pending=state.designs.filter(d=>!d.approved);return `${pagehead("Creator portal","Your designs deserve a route to production.","Designers submit concepts and technical information; garments enter the storefront only after a production-readiness check. All submissions here are local demo records.")}<div class="split"><section class="panel" style="padding:25px"><h2 class="panel-heading">Submit a design for review</h2><form id="design-form"><div class="formgroup"><label for="design-name">Design name</label><input id="design-name" class="field" name="name" maxlength="70" required placeholder="e.g., The Trailside Overshirt"></div><div class="config-row"><div class="formgroup"><label for="design-type">Garment category</label><select id="design-type" class="field" name="type"><option value="top">Top / shirt</option><option value="bottom">Trousers / bottoms</option><option value="layer">Jacket / outer layer</option></select></div><div class="formgroup"><label for="design-license">Example designer license per order</label><select id="design-license" name="license" class="field"><option value="8">$8</option><option value="12" selected>$12</option><option value="20">$20</option></select></div></div><div class="formgroup"><label for="design-desc">Design description</label><textarea id="design-desc" class="field" name="desc" required maxlength="350" placeholder="Tell makers what makes the garment useful or special."></textarea></div><div class="formgroup"><label for="design-file">Optional technical packet (.json)</label><input id="design-file" type="file" class="field" name="specFile" accept=".json,application/json"><small>In this demo, the file is not uploaded or parsed; its filename is included in a local review record. Real production requires versioned pattern assets and a technical specification.</small></div><div class="formgroup"><label class="form-check"><input type="checkbox" name="rights" required><span>I confirm I own or have the rights to license this design for manufacturing.</span></label></div><button class="btn" type="submit">Submit for technical review</button></form></section><aside><div class="panel" style="padding:24px"><h2 class="panel-heading">Review pipeline</h2><div class="step-stack"><div class="step"><span class="step-number">1</span><div><b>Submission received</b><p>Rights declaration, style notes, reference assets and proposed license.</p></div></div><div class="step"><span class="step-number">2</span><div><b>Production review</b><p>Pattern feasibility, material compatibility, sample fit, complexity and estimated labor.</p></div></div><div class="step"><span class="step-number">3</span><div><b>Catalog publication</b><p>An approved immutable design version can accept new orders.</p></div></div></div></div><div class="panel" style="padding:24px;margin-top:15px"><h2 class="panel-heading">Submission inbox</h2>${pending.length?pending.map(d=>`<div style="border-top:1px solid var(--line);padding:13px 0"><div class="flex-between"><b>${escapeHTML(d.title)}</b><span class="tag amber">Awaiting maker review</span></div><p class="help">${escapeHTML(d.desc)} · ${money(d.license)} example licensing</p></div>`).join(""):`<div class="empty"><strong>No pending submissions</strong>Submit a design to see it enter the local review queue.</div>`}<div class="inline-links"><button class="btn secondary small" data-nav="maker">Visit Maker Hub →</button></div></div></aside></div>`}
function maker(){const pendingOrders=state.orders.filter(o=>o.status!=="collected"),pendingDesigns=state.designs.filter(d=>!d.approved);return `${pagehead("Production workspace","A maker-controlled manufacturing queue.","Makers get a limited order packet, review what is feasible, then move accepted orders through production. Every stage shown here is a simulation.")}<div class="metric-row" style="margin-bottom:19px"><div class="metric"><strong>${pendingOrders.length}</strong><span>Open simulated work orders</span></div><div class="metric"><strong>${pendingDesigns.length}</strong><span>Designs awaiting technical review</span></div><div class="metric"><strong>0</strong><span>Connected real factories</span></div></div><div class="two-col"><section class="panel" style="padding:23px"><h2 class="panel-heading">Order queue</h2>${pendingOrders.length?pendingOrders.map(o=>`<div class="order-card" style="padding:15px 0;border-bottom:1px solid var(--line)"><div class="flex-between"><div><div class="overline">${escapeHTML(o.id)}</div><h3 style="margin:5px 0">${escapeHTML(o.design.title)}</h3></div><span class="tag">${escapeHTML(statusLabels[o.status])}</span></div><p class="help">${escapeHTML(o.fabric.name)} · ${escapeHTML(o.fabric.colorName)} · ${escapeHTML(o.cut)} fit · ${escapeHTML(o.pickup)}</p><div class="note" style="margin-bottom:10px"><b>Scoped measurement packet:</b> ${Object.entries(o.measurements).map(([k,v])=>`${escapeHTML(k)} ${escapeHTML(v)} ${escapeHTML(o.fitUnit)}`).join(" · ")}</div><button class="btn small" data-advance="${escapeHTML(o.id)}">${o.status==='submitted'?'Accept simulated job':'Advance stage →'}</button> <button class="btn secondary small" data-download="${escapeHTML(o.id)}">Download production JSON</button></div>`).join(""):`<div class="empty"><strong>No active orders</strong>Create one through the storefront, then return here to test handoff and production stages.<div class="inline-links" style="justify-content:center"><button class="btn secondary small" data-nav="shop">Open storefront</button></div></div>`}</section><section class="panel" style="padding:23px"><h2 class="panel-heading">Design technical review</h2>${pendingDesigns.length?pendingDesigns.map(d=>`<div class="order-card" style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${escapeHTML(d.title)}</strong><p class="help">${escapeHTML(d.desc)}<br>Packet: ${escapeHTML(d.packet||'Not supplied')}</p><button class="btn small" data-approve="${escapeHTML(d.id)}">Mark sample approved (demo)</button></div>`).join(""):`<div class="empty"><strong>No designs awaiting review</strong>Submit a concept in the Designer Studio to test the review-and-publish flow.</div>`}<hr><h3>Real production controls to build</h3><div class="step-stack"><div class="step"><span class="step-number">✓</span><div><b>Maker accepts a capacity-matched job</b><p>They review complexity, wage, estimated time and tooling before agreeing.</p></div></div><div class="step"><span class="step-number">✓</span><div><b>Pattern check and physical sample</b><p>Approving a digital record is not a real-life technical signoff.</p></div></div><div class="step"><span class="step-number">✓</span><div><b>Traceability and quality controls</b><p>Fabric lot, cut sheet, maker checkpoints, deviations and rework.</p></div></div></div></section></div>`}
function orders(){return `${pagehead("Order journey","Every garment has a traceable story.","The timeline links customer decisions to a maker-reviewed production workflow. Orders exist only while this page is open.")}${state.orders.length?state.orders.slice().reverse().map(o=>`<section class="panel order-card"><div class="flex-between"><div><div class="overline">DEMO WORK ORDER ${escapeHTML(o.id)}</div><h2 style="margin:7px 0">${escapeHTML(o.design.title)}</h2><div class="help">${escapeHTML(o.fabric.name)} · ${escapeHTML(o.fabric.colorName)} · ${escapeHTML(o.cut)} fit · ${escapeHTML(o.pickup)}</div></div><span class="status-line ${o.status==='submitted'?'pending':''}">${escapeHTML(statusLabels[o.status])}</span></div><div class="progress" aria-label="Order stage progress">${statuses.map((s,i)=>`<span class="${statuses.indexOf(o.status)>i?'done':o.status===s?'current':''}">${escapeHTML(statusLabels[s])}</span>`).join('')}</div><div class="flex-between"><div class="help">Example estimated price at submission: <strong>${money(o.total)}</strong> · Passport data scoped to maker: ${Object.keys(o.measurements).map(escapeHTML).join(', ')}</div><button class="btn secondary small" data-download="${escapeHTML(o.id)}">Export work order</button></div></section>`).join(""):`<div class="empty"><strong>No demo orders created yet.</strong>Complete a Fit Passport and configure a garment to make your first simulated order.<div class="inline-links" style="justify-content:center"><button class="btn" data-nav="shop">Go to storefront →</button></div></div>`}`}
function render(){nav();qs("#app").innerHTML=({home,shop,fit,designer,maker,orders})[state.view]();document.title=`OmniRoot Apparel — ${state.view.charAt(0).toUpperCase()+state.view.slice(1)} · Prototype v0.1`}
let toastTimer;function toast(msg){const t=qs("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3500)}
function navigate(page){state.view=page;render();scrollTo({top:0,behavior:"instant"})}
function validateFit(){const keys=["chest","waist","hip","inseam"];return keys.every(k=>Number.isFinite(Number(state.fit[k]))&&Number(state.fit[k])>=10&&Number(state.fit[k])<=350)}
function saveFit(){if(!validateFit()){toast("Enter valid chest, waist, hip and inseam measurements first.");return;}state.fitReady=true;toast("Fit Passport validated for this demo—not physically verified.");render()}
function demoProfile(){state.fit={label:"Fictional example — do not use for real production",unit:"cm",chest:"100",waist:"86",hip:"102",inseam:"78",shoulder:"44",preferences:"Relaxed through shoulders and waist",adaptive:""};state.fitReady=true;toast("Fictional measurements loaded.");render()}
function changeUnits(next){const prior=state.fit.unit;if(next===prior)return;for(const key of ["chest","waist","hip","inseam","shoulder"]){if(state.fit[key]!==""){const val=Number(state.fit[key]);if(Number.isFinite(val))state.fit[key]=((prior==='cm'&&next==='in')?val/2.54:val*2.54).toFixed(1)}}state.fit.unit=next;state.fitReady=false;render()}
function relevantMeasurements(type){const keys=type==="bottom"?["waist","hip","inseam"]:["chest","waist","hip","shoulder"];const result={};for(const k of keys){if(state.fit[k]!=="")result[k]=Number(state.fit[k])}return result}
function place(){if(!state.fitReady||!validateFit()){toast("Validate a Fit Passport before creating an order.");navigate("fit");return}const d=design(),f=fabric(),c=f.colors.find(c=>c.hex===state.color)||f.colors[0];const order={id:`OA-${state.nextId++}`,createdAt:new Date().toISOString(),status:"submitted",design:{id:d.id,title:d.title,version:"demo-1",by:d.by},fabric:{id:f.id,name:f.name,colorName:c.name,colorHex:c.hex},cut:state.cut,length:state.length,pockets:state.pockets,pickup:state.pickup,measurements:relevantMeasurements(d.type),fitUnit:state.fit.unit,total:prices().total,illustrative:true,scope:"demo-only"};state.orders.push(order);toast(`${order.id} added to simulated maker queue.`);navigate("orders")}
function advance(id){const o=state.orders.find(o=>o.id===id);if(!o)return;const i=statuses.indexOf(o.status);if(i<statuses.length-1){o.status=statuses[i+1];toast(`${o.id} → ${statusLabels[o.status]}`);render()}}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),800)}
function submitDesigner(form){const fd=new FormData(form);const title=String(fd.get("name")||"").trim(),desc=String(fd.get("desc")||"").trim();if(!form.reportValidity()||!title||!desc)return;const file=qs("#design-file")?.files?.[0];if(file&&file.size>1_000_000){toast("Demo file must be under 1MB.");return}const d={id:`creator-${state.nextId++}`,title,type:String(fd.get("type")),desc,base:95,license:Number(fd.get("license")),by:"Independent designer (demo)",approved:false,packet:file?.name||null};state.designs.push(d);toast("Design submitted to local technical-review queue.");navigate("designer")}
function approve(id){const d=state.designs.find(d=>d.id===id);if(!d||d.approved)return;d.approved=true;toast("Design marked approved in demo. Real production requires technical validation.");render()}
document.addEventListener("click",e=>{const btn=e.target.closest("button");if(!btn)return;if(btn.dataset.nav){navigate(btn.dataset.nav);return}if(btn.dataset.design){state.selected=btn.dataset.design;setBestFabric();render();return}if(btn.dataset.color){state.color=btn.dataset.color;render();return}if(btn.dataset.unit){changeUnits(btn.dataset.unit);return}if(btn.dataset.advance){advance(btn.dataset.advance);return}if(btn.dataset.approve){approve(btn.dataset.approve);return}if(btn.dataset.download){const o=state.orders.find(o=>o.id===btn.dataset.download);if(o)download(`${o.id.toLowerCase()}-production-demo.json`,o);return}if(btn.dataset.action){switch(btn.dataset.action){case"place":place();break;case"save-fit":saveFit();break;case"sample-fit":demoProfile();break;case"clear-fit":state.fit={label:"",unit:"cm",chest:"",waist:"",hip:"",inseam:"",shoulder:"",preferences:"",adaptive:""};state.fitReady=false;render();toast("Passport cleared from prototype memory.");break;case"export-fit":download("fit-passport-demo.json",{...state.fit,validatedForDemo:state.fitReady,notice:"Private file—contains body measurements; not physically verified."});toast("Passport exported to your device.");break}}});
document.addEventListener("change",e=>{const x=e.target;if(x.dataset.config){state[x.dataset.config]=x.value;if(x.dataset.config==='fabric'){state.color=fabric().colors[0].hex}render()}});
document.addEventListener("input",e=>{const x=e.target;if(x.dataset.fit){state.fit[x.dataset.fit]=x.value;state.fitReady=false}});
document.addEventListener("submit",e=>{if(e.target.id==="design-form"){e.preventDefault();submitDesigner(e.target)}});
render();
</script>
</body>
