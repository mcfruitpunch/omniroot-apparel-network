name: Platform tests
on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-tests.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API security and workflow tests
        run: python -m pytest -q tests/
      - name: Python syntax check
        run: python -m compileall -q server.py
      - name: Browser JavaScript syntax check
        run: node --check site/app.js
